; Production's measured limits, reproduced locally so a constraint that will
; bite on the server bites here first (docs/hosting.md).

; A 1,954-row roster import must complete inside this. If it does not fit
; locally it will not fit on the server.
max_execution_time = 30

; The export streams; nothing may assemble a full roster in memory.
memory_limit = 128M

post_max_size = 8M

; The sample .xls is 1.2M, so a full binary workbook only just fits. CSV is
; the supported path — spec 6.1.
upload_max_filesize = 2M

; PHP truncates silently past this: no error, just missing fields. It is the
; reason the assignment screen is select-then-act rather than one control per
; member.
max_input_vars = 1000

; The server stores and compares in UTC and converts only for display.
date.timezone = UTC

default_charset = "UTF-8"

; Matches the server. Errors go to the log, never the screen; app.debug turns
; them back on locally.
display_errors = Off
log_errors = On

; The host's session defaults are unsafe and Rerm\Session overrides every one
; before session_start(). They are left unsafe here on purpose, so that code
; relying on a safe default fails locally rather than on the server.
session.cookie_httponly = 0
session.cookie_secure = 0
session.use_strict_mode = 0
session.gc_maxlifetime = 1440
