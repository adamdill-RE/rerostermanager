# Mirrors the server layout: DOCUMENT_ROOT is the directory that holds BOTH
# apps plus the landing page, and each app is a subdirectory of it. Nothing is
# served from a per-app virtual host, because that is not how the account is
# configured and a local setup that hides the shared root would hide the one
# constraint most likely to break RESM.
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        # Needed so public/.htaccess is read at all. On the server this is the
        # host's setting, not ours.
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
